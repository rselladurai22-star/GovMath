# After each production deploy on Vercel, tell IndexNow search engines which
# pages changed (scripts/indexnow.mjs reads the live sitemap's lastmod dates).
name: IndexNow
on: deployment_status
jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs --days 3
